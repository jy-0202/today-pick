spring.application.name=today-pick

spring.config.import=optional:classpath:application-secret.properties

## MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/todaypick?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## Entity 기준 테이블 검증
spring.jpa.hibernate.ddl-auto=validate

## MySQL Workbench에서 직접 스키마와 더미 데이터를 관리
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

## JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.thejoeun.todaypick=DEBUG