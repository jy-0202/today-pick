<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">

<!-- head -->
<head th:replace="~{fragments/commonHead :: commonHead('조건 추천')}"></head>

<body data-page="condition">

	<!-- START : header -->
	<div th:replace="~{fragments/header :: header}"></div>

  <main class="container">
    <section class="condition-panel">
      <div class="section-title">
        <div>
          <h1>원하는 조건을 선택해주세요</h1>
          <p>선택한 조건을 기반으로 딱 맞는 맛집을 추천해드려요!</p>
        </div>
        <div>
          <button id="resetBtn" class="outline">↻ 초기화</button>
          <button class="primary" onclick="goResult()">추천 받기 ✨</button>
        </div>
      </div>

      <div class="option-box">

		<div class="option-row">
		  <strong>📍 지역 선택</strong>

		  <div class="region-controls">
			<select name="city" id="city">
			  <option value="all-city">시/도 선택</option>
			  <option th:each="city : ${cities}" th:value="${city}" th:text="${city}"></option>
			</select>
			
			<select name="district" id="district">
			  <option value="all-district">구/군 선택</option>
			</select>
			
			<select name="town" id="town">
			  <option value="all-town">동/읍/면 선택</option>
			</select>

			<button id="currentLocationBtn" class="outline" type="button"
					disabled title="지도 연동 후 지원 예정입니다.">📍 현재 위치
			</button>
		  </div>
		  
		</div>

				<!-- 
        <div class="option-row">
          <strong>📍 지역 선택</strong>
          
          <select name="city" id="city">
			<option value="all-city">시/도 선택</option>
			<option th:each="city : ${cities}" th:value="${city}" th:text="${city}"></option>
		  </select>
		  
		  <select name="district" id="district">
			<option value="all-district">구/군 선택</option>
		  </select>
		  
		  <select name="town" id="town">
			<option value="all-town">동/읍/면 선택</option>
		  </select>

          
          <button id="currentLocationBtn" class="outline" type="button" disabled 
          		title="지도 연동 후 지원 예정입니다.">
    			📍 현재 위치
    	  </button>

        </div>
 -->
        
        <div id="food-type-group" class="option-row">
		  <strong>🍴 음식 종류</strong>
		  <div class="option-buttons">
			<button class="select-chip active">전체</button>
			<button class="select-chip">한식</button>
			<button class="select-chip">중식</button>
			<button class="select-chip">일식</button>
			<button class="select-chip">양식</button>
			<button class="select-chip">분식</button>
			<button class="select-chip">카페/디저트</button>
		  </div>
		</div>

		<div id="price-range-group" class="option-row">
		  <strong>💳 가격대</strong>
		  <div class="option-buttons">
			<button class="select-chip active">전체</button>
			<button class="select-chip">1만원 이하</button>
			<button class="select-chip">1~2만원</button>
			<button class="select-chip">2~3만원</button>
			<button class="select-chip">3~5만원</button>
			<button class="select-chip">5만원 이상</button>
		  </div>
		</div>

				<!-- 음식점 수용 인원 데이터 추가 후 활성화
        
        <div id="people-count-group" class="option-row">
          <strong>👥 인원</strong>
          <button class="select-chip active">전체</button>
          <button class="select-chip">1~2명</button>
          <button class="select-chip">3~4명</button>
          <button class="select-chip">5~8명</button>
          <button class="select-chip">9명 이상</button>
        </div>
        -->
        
        <div id="feature-group" class="option-row vertical">
          <strong>⚙ 상세 조건 <small>(복수 선택 가능)</small></strong>

			<div class="chip-wrap">
				<button class="select-chip" data-value="비 오는 날">☔ 비 오는 날</button>
				<button class="select-chip" data-value="회식 장소">👥 회식 장소</button>
				<button class="select-chip" data-value="데이트">❤ 데이트</button>
				<button class="select-chip" data-value="가성비 좋은 곳">🏷️ 가성비 좋은 곳</button>
				<button class="select-chip" data-value="분위기 좋은 곳">✨ 분위기 좋은 곳</button>
				<button class="select-chip" data-value="조용한 곳">조용한 곳</button>
				<button class="select-chip" data-value="주차 가능">주차 가능</button>
				<button class="select-chip" data-value="단체석 보유">단체석 보유</button>
				<button class="select-chip" data-value="특별한 날">🎁 특별한 날</button>
			</div>
		</div>
        
      </div>
    </section>

    <section class="section">
      <h2>인기 조건 조합</h2>
      <div class="combo-grid">
        <div class="combo-card">☔ <strong>비 오는 날 데이트</strong>
          <p>비 오는 날, 분위기 좋은 실내 데이트 장소</p>
        </div>
        <div class="combo-card">👥 <strong>회식하기 좋은 곳</strong>
          <p>단체 모임에 적합한 넓고 편한 공간</p>
        </div>
        <div class="combo-card">🌿 <strong>건강한 한 끼</strong>
          <p>건강하고 맛있는 건강식 메뉴</p>
        </div>
        <div class="combo-card">🌙 <strong>늦은 저녁 식사</strong>
          <p>야식 가능한 늦게까지 하는 맛집</p>
        </div>
      </div>
    </section>
  </main>

  <!-- START : footer  -->
  <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
