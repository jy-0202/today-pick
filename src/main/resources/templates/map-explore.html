<!DOCTYPE html>
<html lang="ko" xmlns:th="https://www.thymeleaf.org">

<!-- head -->
<head th:replace="~{fragments/commonHead :: commonHead('내 주변 맛집')}"></head>

<body data-page="map" class="map-page">

	<!-- START : header -->
	<div th:replace="~{fragments/header :: header}"></div>

  <main class="map-layout">
    <aside class="map-sidebar">
    
      <div class="map-search">
        <input type="text" placeholder="지역, 음식, 가게명을 검색해보세요" />
        <button class="outline">📍 내 위치</button>
      </div>
      
	  <div class="current-location">
		<strong>지도 탐색</strong>
		<p>마커를 선택하면 해당 음식점 위치로 이동합니다.</p>
	  </div>
      
      <div class="sort-line">
        <button>추천순</button>
        <button>거리순</button>
        <button>평점순</button>
        <span>총 <strong id="mapResultCount" th:text="${#lists.size(restaurants)}">0</strong>개</span>
      </div>

	  <div class="map-list">
	  
		<div class="mini-card map-restaurant-item"
			th:each="restaurant : ${restaurants}"
			th:data-id="${restaurant.id}" th:data-name="${restaurant.name}"
			th:data-address="${restaurant.address}"
			th:data-category="${#lists.isEmpty(restaurant.categories) ? '맛집' : restaurant.categories[0]}"
			th:data-rating="${restaurant.averageRating}"
			th:data-review-count="${restaurant.reviewCount}"
			th:data-detail-url="@{/restaurants/{id}(id=${restaurant.id})}"
			th:data-latitude="${restaurant.latitude}"
			th:data-longitude="${restaurant.longitude}">

		  <div class="mini-img">
			<img th:src="@{/img/restaurant/default-restaurant.png}"
					th:alt="${restaurant.name}">
		  </div>

		  <div class="mini-card-info">
			<h3 th:text="${restaurant.name}">음식점명</h3>

			<span class="map-category"
				th:if="${not #lists.isEmpty(restaurant.categories)}"
				th:text="${restaurant.categories[0]}"> 카테고리 </span>

			<p th:text="${restaurant.address}">주소</p>
			<b th:if="${restaurant.reviewCount != null and restaurant.reviewCount > 0}">
				★ <span th:text="${restaurant.averageRating}">0.0</span> 
				<small th:text="|(${restaurant.reviewCount})|">(0)</small>
			</b>
			<small th:if="${restaurant.reviewCount == null or restaurant.reviewCount == 0}">
				등록된 리뷰가 없습니다. 
			</small>
			<a class="map-detail-button" 
				th:href="@{/restaurants/{id}(id=${restaurant.id})}"> 상세보기 </a>
		  </div>
		  
		</div>
		
		<p id="mapEmptyMessage" class="map-empty-message" hidden>
			현재 지도 범위에 표시할 음식점이 없습니다.
		</p>
		
	  </div>
